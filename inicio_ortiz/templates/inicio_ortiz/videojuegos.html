{% extends 'base.html' %}
{% load static %}

{% block title %}Videojuegos{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width: 800px;">

    <div class="text-center mb-4">
        <h1>Videojuegos</h1>
        <p class="lead">
            Conoce el mundo de los videojuegos.
        </p>
    </div>

    <div id="carouselVideojuegos" class="carousel slide">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="{% static 'images/videojuego1.png' %}" class="d-block w-100" alt="Videojuego 1">
            </div>

            <div class="carousel-item">
                <img src="{% static 'images/videojuego2.png' %}" class="d-block w-100" alt="Videojuego 2">
            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselVideojuegos" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carouselVideojuegos" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

    <div class="text-center mt-4">
        <a href="{% url 'inicio_ortiz:inicio' %}" class="btn btn-primary">
            Volver al inicio
        </a>
    </div>

</div>

{% endblock %}
