{% extends 'base.html' %}
{% load static %}

{% block title %}Ciberseguridad{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width: 800px;">

    <div class="text-center mb-4">
        <h1>Ciberseguridad</h1>
        <p class="lead">
            Conoce conceptos relacionados a la ciberseguridad.
        </p>
    </div>

    <div id="carouselCiber" class="carousel slide">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="{% static 'images/ciber1.png' %}" class="d-block w-100" alt="Ciberseguridad 1">
            </div>

            <div class="carousel-item">
                <img src="{% static 'images/ciber2.png' %}" class="d-block w-100" alt="Ciberseguridad 2">
            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carouselCiber" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carouselCiber" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

    <div class="text-center mt-4">
        <a href="{% url 'inicio_ortiz:inicio' %}" class="btn btn-primary">
            Volver al inicio
        </a>
    </div>

</div>

{% endblock %}
